# Compose reads .env for interpolation, but each container receives only the
# allowlisted values below. Adding a new secret to .env does not grant it to
# every PHP process automatically.
x-laravel-base-environment: &laravel-base-environment
  APP_NAME: ${APP_NAME:-Customer Portal}
  APP_ENV: production
  APP_KEY: ${APP_KEY:?APP_KEY is required}
  APP_DEBUG: "false"
  APP_URL: ${APP_URL:-https://customerportal.theomeds.com}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-customerportal.theomeds.com}
  TRUSTED_PROXIES: ${TRUSTED_PROXIES:-*}
  CSP_REPORT_ONLY: ${CSP_REPORT_ONLY:-true}
  SECURITY_HSTS: ${SECURITY_HSTS:-true}
  RELIABILITY_HEARTBEAT_MAX_AGE_SECONDS: ${RELIABILITY_HEARTBEAT_MAX_AGE_SECONDS:-180}
  RELIABILITY_CHECK_REDIS: ${RELIABILITY_CHECK_REDIS:-true}
  ORDER_REMINDERS_ENABLED: ${ORDER_REMINDERS_ENABLED:-false}
  ORDER_REMINDERS_TIMEZONE: ${ORDER_REMINDERS_TIMEZONE:-Asia/Manila}
  ORDER_REMINDERS_QUIET_HOURS_START: ${ORDER_REMINDERS_QUIET_HOURS_START:-20}
  ORDER_REMINDERS_QUIET_HOURS_END: ${ORDER_REMINDERS_QUIET_HOURS_END:-8}
  ORDER_REMINDERS_CUSTOMER_SMS_ENABLED: ${ORDER_REMINDERS_CUSTOMER_SMS_ENABLED:-false}
  ORDER_REMINDERS_ROLLOUT_GRACE_HOURS: ${ORDER_REMINDERS_ROLLOUT_GRACE_HOURS:-24}
  APP_LOCALE: ${APP_LOCALE:-en}
  APP_FALLBACK_LOCALE: ${APP_FALLBACK_LOCALE:-en}
  APP_MAINTENANCE_DRIVER: ${APP_MAINTENANCE_DRIVER:-file}
  LOG_CHANNEL: ${LOG_CHANNEL:-stderr}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  SESSION_DRIVER: ${SESSION_DRIVER:-redis}
  SESSION_CONNECTION: ${SESSION_CONNECTION:-sessions}
  SESSION_LIFETIME: ${SESSION_LIFETIME:-120}
  SESSION_ENCRYPT: ${SESSION_ENCRYPT:-false}
  SESSION_SECURE_COOKIE: ${SESSION_SECURE_COOKIE:-true}
  SESSION_HTTP_ONLY: ${SESSION_HTTP_ONLY:-true}
  SESSION_SAME_SITE: ${SESSION_SAME_SITE:-lax}
  SESSION_PARTITIONED_COOKIE: ${SESSION_PARTITIONED_COOKIE:-false}
  SESSION_PATH: ${SESSION_PATH:-/}
  SESSION_DOMAIN: ${SESSION_DOMAIN:-null}

x-database-environment: &database-environment
  DB_CONNECTION: ${DB_CONNECTION:-mysql}
  DB_HOST: ${DB_HOST:-db}
  DB_PORT: ${DB_PORT:-3306}
  DB_DATABASE: ${DB_DATABASE:-customer_portal}
  DB_USERNAME: ${DB_USERNAME:-customer_portal}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

x-mysql-environment: &mysql-environment
  MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD is required}
  MYSQL_DATABASE: ${DB_DATABASE:-customer_portal}
  MYSQL_USER: ${DB_USERNAME:-customer_portal}
  MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}

x-redis-environment: &redis-environment
  REDIS_CLIENT: ${REDIS_CLIENT:-phpredis}
  REDIS_HOST: ${REDIS_HOST:-redis}
  REDIS_PASSWORD: ${REDIS_PASSWORD:-null}
  REDIS_PORT: ${REDIS_PORT:-6379}
  REDIS_SESSION_DB: ${REDIS_SESSION_DB:-2}

x-reverb-environment: &reverb-environment
  BROADCAST_CONNECTION: ${BROADCAST_CONNECTION:-reverb}
  REVERB_APP_ID: ${REVERB_APP_ID:?REVERB_APP_ID is required}
  REVERB_APP_KEY: ${REVERB_APP_KEY:?REVERB_APP_KEY is required}
  REVERB_APP_SECRET: ${REVERB_APP_SECRET:?REVERB_APP_SECRET is required}
  REVERB_HOST: ${REVERB_HOST:-reverb}
  REVERB_PORT: ${REVERB_PORT:-8080}
  REVERB_SCHEME: ${REVERB_SCHEME:-http}

services:
  app:
    image: customerportal-laravel-app:latest
    build:
      context: .
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-}
    environment:
      <<: [*laravel-base-environment, *database-environment, *redis-environment, *reverb-environment]
      APP_PREVIOUS_KEYS: ${APP_PREVIOUS_KEYS:-}
      ACCOUNT_DELETION_RETENTION_DAYS: ${ACCOUNT_DELETION_RETENTION_DAYS:-30}
      DATA_ERASURE_DEADLINE_DAYS: ${DATA_ERASURE_DEADLINE_DAYS:-30}
      BCRYPT_ROUNDS: ${BCRYPT_ROUNDS:-12}
      # Not `file`: on this NAS's container runtime, `docker compose exec`
      # (and possibly PHP-FPM's own worker processes) can't create new
      # subdirectories under the app-owned tmpfs cache dir even as root --
      # confirmed via `system:smoke-test`, which caught every file-cache
      # write failing outright. Redis is already required for
      # sessions/queues and already proven working here.
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      MAIL_MAILER: ${MAIL_MAILER:-log}
      MAIL_SCHEME: ${MAIL_SCHEME:-null}
      MAIL_HOST: ${MAIL_HOST:-127.0.0.1}
      MAIL_PORT: ${MAIL_PORT:-2525}
      MAIL_USERNAME: ${MAIL_USERNAME:-null}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-null}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-hello@example.com}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-Customer Portal}
      POSTMARK_API_KEY: ${POSTMARK_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
      AWS_BUCKET: ${AWS_BUCKET:-}
      AWS_URL: ${AWS_URL:-}
      AWS_ENDPOINT: ${AWS_ENDPOINT:-}
      AWS_USE_PATH_STYLE_ENDPOINT: ${AWS_USE_PATH_STYLE_ENDPOINT:-false}
      INVENTORY_API_BASE_URL: ${INVENTORY_API_BASE_URL:-https://inventoryapp.theomeds.com/theomeds/inventoryapp/v1}
      INVENTORY_API_TOKEN: ${INVENTORY_API_TOKEN:?INVENTORY_API_TOKEN is required}
      PO_NOTIFICATIONS_EMAIL_ENABLED: ${PO_NOTIFICATIONS_EMAIL_ENABLED:-false}
      PO_NOTIFICATIONS_FACEBOOK_ENABLED: ${PO_NOTIFICATIONS_FACEBOOK_ENABLED:-false}
      PO_NOTIFICATIONS_SMS_ENABLED: ${PO_NOTIFICATIONS_SMS_ENABLED:-false}
      PUBLIC_CONVERSATION_LINK_TTL_HOURS: ${PUBLIC_CONVERSATION_LINK_TTL_HOURS:-720}
      PUBLIC_CONVERSATION_REPLY_MAX_LENGTH: ${PUBLIC_CONVERSATION_REPLY_MAX_LENGTH:-2000}
      PUBLIC_CONVERSATION_REPLY_WINDOW_SECONDS: ${PUBLIC_CONVERSATION_REPLY_WINDOW_SECONDS:-900}
      PUBLIC_CONVERSATION_REPLY_LIMIT: ${PUBLIC_CONVERSATION_REPLY_LIMIT:-5}
      META_MESSENGER_PAGE_ACCESS_TOKEN: ${META_MESSENGER_PAGE_ACCESS_TOKEN:-}
      META_MESSENGER_APP_SECRET: ${META_MESSENGER_APP_SECRET:-}
      META_MESSENGER_WEBHOOK_VERIFY_TOKEN: ${META_MESSENGER_WEBHOOK_VERIFY_TOKEN:-}
      META_MESSENGER_GRAPH_API_VERSION: ${META_MESSENGER_GRAPH_API_VERSION:-v19.0}
      SEMAPHORE_API_KEY: ${SEMAPHORE_API_KEY:-}
      SEMAPHORE_SENDER_NAME: ${SEMAPHORE_SENDER_NAME:-}
      LOGIN_LOCKOUT_THRESHOLD: ${LOGIN_LOCKOUT_THRESHOLD:-5}
      LOGIN_LOCKOUT_WINDOW_MINUTES: ${LOGIN_LOCKOUT_WINDOW_MINUTES:-15}
      MOBILE_APP_LATEST_VERSION_CODE: ${MOBILE_APP_LATEST_VERSION_CODE:-1}
      MOBILE_APP_LATEST_VERSION_NAME: ${MOBILE_APP_LATEST_VERSION_NAME:-1.0}
      MOBILE_APP_MIN_VERSION_CODE: ${MOBILE_APP_MIN_VERSION_CODE:-1}
    restart: unless-stopped
    volumes:
      - laravel_storage:/app/storage/app/private
    tmpfs:
      # Sessions and cache use Redis, not these paths -- this tmpfs backs
      # compiled Blade views and bootstrap's cache dir, both ephemeral,
      # rebuilt on container start, nothing here needs to survive a
      # restart. Logs go to stderr (LOG_CHANNEL=stderr in .env) instead
      # of a file, specifically so storage/logs doesn't need to be
      # writable either -- nothing else needs to persist outside the
      # mounted volume above.
      - /app/storage/framework/sessions
      - /app/storage/framework/cache
      - /app/storage/framework/views
      - /app/bootstrap/cache
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      # entrypoint.sh starts as root specifically to chown the tmpfs
      # mounts above (fresh, root-owned on every start) before dropping
      # to the unprivileged `app` user via su-exec -- php-fpm itself
      # never runs as root. Same pattern the proxy service already
      # uses for its own root-then-drop nginx startup.
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    expose:
      - "9000"
    networks:
      - default
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "php -r \"new PDO('mysql:host=' . getenv('DB_HOST') . ';port=' . getenv('DB_PORT'), getenv('DB_USERNAME'), getenv('DB_PASSWORD'));\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  reverb:
    image: customerportal-laravel-app:latest
    environment:
      <<: [*laravel-base-environment, *redis-environment, *reverb-environment]
      REVERB_SERVER_HOST: ${REVERB_SERVER_HOST:-0.0.0.0}
      REVERB_SERVER_PORT: ${REVERB_SERVER_PORT:-8080}
      REVERB_SERVER_PATH: ${REVERB_SERVER_PATH:-}
      REVERB_ALLOWED_ORIGINS: ${REVERB_ALLOWED_ORIGINS:?REVERB_ALLOWED_ORIGINS is required}
      REVERB_SCALING_ENABLED: ${REVERB_SCALING_ENABLED:-false}
      # Reverb polls Laravel's cache for graceful restart signals. Without an
      # explicit store Laravel falls back to the database cache and default
      # SQLite connection, because this deliberately isolated service has no
      # DB env -- so this can't be left unset. Redis (not `file`): on this
      # NAS's container runtime, writes to the app-owned tmpfs cache dir can
      # fail even as root (see the `app` service's CACHE_STORE comment,
      # confirmed via `system:smoke-test`). Reverb already has Redis env via
      # *redis-environment above.
      CACHE_STORE: redis
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    depends_on:
      app:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      - /app/storage/framework/sessions
      - /app/storage/framework/cache
      - /app/storage/framework/views
      - /app/bootstrap/cache
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    expose:
      - "8080"
    networks:
      - default
    healthcheck:
      test:
        - CMD-SHELL
        - "php -r \"exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);\""
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  broadcast-worker:
    image: customerportal-laravel-app:latest
    environment:
      <<: [*laravel-base-environment, *database-environment, *redis-environment, *reverb-environment]
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      # Not `file` -- same reason as the `app` service above.
      CACHE_STORE: redis
      PO_NOTIFICATIONS_SMS_ENABLED: ${PO_NOTIFICATIONS_SMS_ENABLED:-false}
      SEMAPHORE_API_KEY: ${SEMAPHORE_API_KEY:-}
      SEMAPHORE_SENDER_NAME: ${SEMAPHORE_SENDER_NAME:-}
    command: ["php", "artisan", "queue:work", "--queue=monitoring,broadcasts,notifications", "--sleep=1", "--tries=4", "--timeout=60"]
    depends_on:
      app:
        condition: service_healthy
      redis:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      - /app/storage/framework/sessions
      - /app/storage/framework/cache
      - /app/storage/framework/views
      - /app/bootstrap/cache
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 192m
    networks:
      - default

  db:
    # This app used to reach the legacy Flask app's shared MySQL over an
    # external Docker network (see git history / docs/flask-coupling.md
    # for that arrangement and why it ended). Flask is retired: this is
    # now a plain, self-contained MySQL owned entirely by this Compose
    # project, matching every other service here.
    image: mysql:8.4@sha256:85b9bf2e29cf836ecb8c2a15a935d4ba0c606631dff1dd79531a11983c638f2a
    environment:
      <<: *mysql-environment
    restart: unless-stopped
    volumes:
      - mysql_data:/var/lib/mysql
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    networks:
      - default
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1"]
    restart: unless-stopped
    volumes:
      - redis_data:/data
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    networks:
      - default
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  scheduler:
    image: customerportal-laravel-app:latest
    environment:
      <<: [*laravel-base-environment, *database-environment, *redis-environment]
      # Scheduler mutexes must be shared and atomic for withoutOverlapping()
      # and onOneServer(); its local file cache is isolated to this container.
      CACHE_STORE: redis
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-local}
      ACCOUNT_DELETION_RETENTION_DAYS: ${ACCOUNT_DELETION_RETENTION_DAYS:-30}
      DATA_ERASURE_DEADLINE_DAYS: ${DATA_ERASURE_DEADLINE_DAYS:-30}
      INVENTORY_API_BASE_URL: ${INVENTORY_API_BASE_URL:-https://inventoryapp.theomeds.com/theomeds/inventoryapp/v1}
      INVENTORY_API_TOKEN: ${INVENTORY_API_TOKEN:?INVENTORY_API_TOKEN is required}
    command: ["php", "artisan", "schedule:work"]
    depends_on:
      app:
        condition: service_healthy
      db:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      - /app/storage/framework/sessions
      - /app/storage/framework/cache
      - /app/storage/framework/views
      - /app/bootstrap/cache
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    networks:
      - default

  proxy:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      args:
        VITE_REVERB_APP_KEY: ${VITE_REVERB_APP_KEY}
        VITE_REVERB_HOST: ${VITE_REVERB_HOST:-}
        VITE_REVERB_PORT: ${VITE_REVERB_PORT:-}
        VITE_REVERB_SCHEME: ${VITE_REVERB_SCHEME:-}
    depends_on:
      app:
        condition: service_healthy
      reverb:
        condition: service_healthy
    restart: unless-stopped
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    read_only: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    ports:
      - "${HOST_PORT:-8090}:8080"
    healthcheck:
      test:
        - CMD
        - wget
        - --quiet
        - --spider
        - http://127.0.0.1:8080/health/proxy
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      default:
      # Joins the same network the shared cloudflared tunnel container
      # is on, exactly like the Flask app's own `proxy` service does --
      # this is what lets the tunnel's public-hostname route reach this
      # container by name. The alias is the value to put in Cloudflare's
      # Zero Trust dashboard as the route's target service
      # (http://customerportal-laravel-proxy:8080), the same way
      # `customerportal-proxy` is presumably already the Flask target
      # today (confirm the current value there before changing it, so
      # the cutover is a one-line revert if anything goes wrong).
      cloudflare:
        aliases:
          - customerportal-laravel-proxy

volumes:
  laravel_storage:
  redis_data:
  mysql_data:

networks:
  # The external network used by cloudflared-wtms. The tunnel routes
  # customerportal.theomeds.com to customerportal-laravel-proxy:8080,
  # so the proxy must share this network for Docker DNS to resolve its alias.
  cloudflare:
    external: true
    name: ${CLOUDFLARE_NETWORK:-cloudflared_default}
