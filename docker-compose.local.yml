# Standalone local development stack -- NOT the NAS deployment config
# (see docker-compose.yml for that). This one is fully self-contained:
# its own MySQL, no external Flask network, no Cloudflare tunnel, no
# read-only/hardened production settings. Source is bind-mounted so
# edits on your machine show up immediately for JS (Vite HMR).
#
# PHP is different: opcache.revalidate_freq is set high (see the app
# command below) because on Windows, bind-mounted file I/O into the
# container is slow enough that Laravel's framework boot (stat-ing
# thousands of vendor/ files every request) can take 5-10+ seconds
# without it. The tradeoff: after editing a .php file, restart the app
# container to see the change --
#   docker compose -f docker-compose.local.yml restart app
#
# Usage:
#   docker compose -f docker-compose.local.yml up
#
# The app container installs Composer deps, copies .env.example -> .env
# (only if .env doesn't already exist) and generates an APP_KEY (only if
# unset) automatically on every start -- see its command below. The one
# thing still manual, since it depends on which database path you're
# using (see the setup instructions you were given):
#   docker compose -f docker-compose.local.yml exec app php artisan migrate   # only for a fresh/empty DB
#   docker compose -f docker-compose.local.yml exec vite npm ci               # first time only, for the Vite container
#
# App: http://localhost:8180
# Vite dev server (HMR): http://localhost:5273 by default -- app.blade.php's @vite
# directive talks to it automatically in APP_ENV=local.

services:
    db:
        image: mysql:8@sha256:b3b90af2a6552ae30c266fdb7d5dd55f3afb72404bb78d37fe8a23eb857fd3fb
        environment:
            MYSQL_ROOT_PASSWORD: root
            MYSQL_DATABASE: customer_portal
            MYSQL_USER: customer_portal
            MYSQL_PASSWORD: localdev
        ports:
            # Host port 3307, not 3306 -- avoids clashing with any MySQL
            # you might already have running locally.
            - '3307:3306'
        volumes:
            - customerportal_local_db:/var/lib/mysql
        healthcheck:
            test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
            interval: 5s
            timeout: 5s
            retries: 10

    app:
        image: customerportal-laravel-app:latest
        build:
            context: .
            args:
                VITE_REVERB_APP_KEY: customerportal-local-key
                VITE_REVERB_HOST: localhost
                VITE_REVERB_PORT: 8181
                VITE_REVERB_SCHEME: http
        working_dir: /app
        volumes:
            - .:/app
            # Keep vendor/ off the Windows bind mount -- Laravel's framework
            # boot stats thousands of these files every request, and Composer
            # installs/updates thousands more; both are slow through Docker
            # Desktop's Windows filesystem translation. Mirrors the same fix
            # already applied to node_modules on the vite service below.
            - customerportal_local_vendor:/app/vendor
        ports:
            - '8180:8000'
        depends_on:
            db:
                condition: service_healthy
        environment:
            APP_ENV: local
            LOCAL_DEVELOPMENT: 'true'
        # PHP extensions and Composer are already in the shared app image.
        # Refresh the named vendor volume, then serve the bind-mounted source.
        command: >
            sh -c "
              composer install --no-interaction --no-plugins &&
              [ -f .env ] || cp .env.example .env &&
              grep -q '^APP_KEY=base64:' .env || php artisan key:generate &&
              PHP_CLI_SERVER_WORKERS=4 php artisan serve --host=0.0.0.0 --port=8000 --no-reload
            "
        # Keep a generous first-run window for image build and Composer.
        healthcheck:
            test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8000/login']
            interval: 5s
            timeout: 5s
            retries: 3
            start_period: 360s

    redis:
        image: redis:7-alpine@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        command: ['redis-server', '--appendonly', 'yes', '--save', '60', '1']
        volumes:
            - customerportal_local_redis:/data
        healthcheck:
            test: ['CMD', 'redis-cli', 'ping']
            interval: 5s
            timeout: 5s
            retries: 10

    reverb:
        image: customerportal-laravel-app:latest
        working_dir: /app
        environment:
            APP_ENV: local
        volumes:
            - .:/app
            - customerportal_local_vendor:/app/vendor
        ports:
            - '8181:8080'
        depends_on:
            app:
                condition: service_healthy
        command: ['php', 'artisan', 'reverb:start', '--host=0.0.0.0', '--port=8080']
        restart: unless-stopped
        healthcheck:
            test:
                - CMD-SHELL
                - "php -r \"exit(@fsockopen('127.0.0.1', 8080) ? 0 : 1);\""
            interval: 10s
            timeout: 5s
            retries: 5

    broadcast-worker:
        image: customerportal-laravel-app:latest
        working_dir: /app
        environment:
            APP_ENV: local
        volumes:
            - .:/app
            - customerportal_local_vendor:/app/vendor
        depends_on:
            app:
                condition: service_healthy
            redis:
                condition: service_healthy
        command: ['php', 'artisan', 'queue:work', '--queue=broadcasts', '--sleep=1', '--tries=3', '--timeout=60']
        restart: unless-stopped

    vite:
        image: node:20-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
        working_dir: /app
        environment:
            # Keep the browser-facing URL in sync with the published host
            # port. Override VITE_HOST_PORT if 5273 is unavailable locally.
            VITE_HMR_PORT: '${VITE_HOST_PORT:-5273}'
        volumes:
            - .:/app
            # Keep Linux dependencies off the Windows bind mount. Vite reads
            # thousands of these files while optimizing a cold dependency
            # graph, and doing that through Docker Desktop can take minutes.
            - customerportal_local_node_modules:/app/node_modules
        ports:
            # Windows/Hyper-V commonly reserves ranges that can include
            # Vite's usual 5173 port. The container still listens on 5173;
            # only the host-facing port changes.
            - '${VITE_HOST_PORT:-5273}:5173'
        command: sh -c "npm ci --ignore-scripts && npm run dev -- --host 0.0.0.0"
        healthcheck:
            test:
                [
                    'CMD',
                    'node',
                    '-e',
                    "(async () => { for (const path of ['/resources/js/app.jsx', '/resources/css/app.css', '/resources/js/Pages/Auth/Login.jsx']) { const response = await fetch('http://127.0.0.1:5173' + path); if (!response.ok) process.exit(1); await response.arrayBuffer(); } })().then(() => process.exit(0)).catch(() => process.exit(1))",
                ]
            interval: 5s
            # Dependency optimization and Tailwind's first compile are
            # intentionally part of readiness; either can be slow on a
            # cold Windows bind mount.
            timeout: 120s
            retries: 3
            start_period: 120s

volumes:
    customerportal_local_db:
    customerportal_local_node_modules:
    customerportal_local_redis:
    customerportal_local_vendor:
