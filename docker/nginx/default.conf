# A bare "proxy_pass http://reverb:8080" or "fastcgi_pass app:9000" resolves
# the container's IP once, when this worker starts, and never again -- if
# that container is later recreated on its own (a new IP), nginx keeps
# connecting to the dead old IP until nginx itself restarts. Docker's
# embedded DNS (127.0.0.11 on any user-defined network, which this compose
# project's containers all sit on) plus a variable target forces a fresh
# lookup instead, capped at 10s so it isn't a DNS round trip per request.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /app/public;
    index index.php;
    client_max_body_size 8m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /health/proxy {
        access_log off;
        return 204;
    }

    location ^~ /app {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_read_timeout 65s;
        proxy_send_timeout 65s;
        proxy_buffering off;
        set $reverb_upstream http://reverb:8080;
        proxy_pass $reverb_upstream;
    }

    location ^~ /apps {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        set $reverb_upstream http://reverb:8080;
        proxy_pass $reverb_upstream;
    }

    # Files here (currently just the APK download) get replaced in place
    # at the same URL on every update -- explicitly refusing to cache them
    # keeps Cloudflare's edge from serving a stale copy after a rebuild,
    # which it otherwise will (observed: a 4-hour-old build served with
    # cf-cache-status: HIT well after a fresh file was already on origin).
    location ^~ /downloads/ {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $app_upstream app:9000;
        fastcgi_pass $app_upstream;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_read_timeout 65s;
        # Default 4k/8k is too small once the CSP header plus session/XSRF
        # cookies are combined -- nginx then drops the whole response with
        # "upstream sent too big header" instead of forwarding it.
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    location ~* \.(css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        access_log off;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }

    location ^~ /build/assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri =404;
    }
}
