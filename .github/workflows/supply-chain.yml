name: Supply-chain integrity

on:
  push:
    paths:
      - '.github/workflows/supply-chain.yml'
      - '.github/dependabot.yml'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'composer.json'
      - 'composer.lock'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.local.yml'
      - 'docker/nginx/Dockerfile'
  pull_request:
    paths:
      - '.github/workflows/supply-chain.yml'
      - '.github/dependabot.yml'
      - '.npmrc'
      - 'package.json'
      - 'package-lock.json'
      - 'composer.json'
      - 'composer.lock'
      - 'Dockerfile'
      - 'docker-compose.yml'
      - 'docker-compose.local.yml'
      - 'docker/nginx/Dockerfile'
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supply-chain-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify locks, advisories, and builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # actions/checkout v4, pinned to the verified v4 tag commit.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Validate Compose configuration
        run: |
          docker compose --env-file .env.production.example -f docker-compose.yml config --no-interpolate --quiet
          docker compose -f docker-compose.local.yml config --no-interpolate --quiet

      - name: Verify npm lock integrity without lifecycle scripts
        run: >-
          docker run --rm
          --mount "type=bind,source=${{ github.workspace }},target=/app,readonly"
          --mount "type=tmpfs,destination=/app/node_modules"
          --workdir /app
          node:20-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
          npm ci --ignore-scripts --audit=false

      - name: Reject high-severity npm advisories
        run: >-
          docker run --rm
          --mount "type=bind,source=${{ github.workspace }},target=/app,readonly"
          --workdir /app
          node:20-slim@sha256:2cf067cfed83d5ea958367df9f966191a942351a2df77d6f0193e162b5febfc0
          npm audit --audit-level=high

      - name: Validate Composer manifest and lock
        run: >-
          docker run --rm
          --mount "type=bind,source=${{ github.workspace }},target=/app,readonly"
          --workdir /app
          composer:2@sha256:4d71c3c2109c61d5415544264b59ad4087e4c5b7244481723664138fd36d5040
          composer validate --strict --no-check-publish

      - name: Reject Composer security advisories
        run: >-
          docker run --rm
          --mount "type=bind,source=${{ github.workspace }},target=/app,readonly"
          --workdir /app
          composer:2@sha256:4d71c3c2109c61d5415544264b59ad4087e4c5b7244481723664138fd36d5040
          composer audit --locked --no-interaction

      - name: Verify production application build
        run: >-
          docker build --pull --target runtime
          --build-arg VITE_REVERB_APP_KEY=ci-public-key
          --build-arg VITE_REVERB_HOST=localhost
          --build-arg VITE_REVERB_PORT=8080
          --build-arg VITE_REVERB_SCHEME=http
          --tag customerportal-app:ci .

      - name: Verify production proxy build
        run: >-
          docker build --pull --file docker/nginx/Dockerfile
          --build-arg VITE_REVERB_APP_KEY=ci-public-key
          --build-arg VITE_REVERB_HOST=localhost
          --build-arg VITE_REVERB_PORT=8080
          --build-arg VITE_REVERB_SCHEME=http
          --tag customerportal-proxy:ci .
